services:
  hecf:
    build: .
    container_name: hecf
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /sys/class/powercap:/sys/class/powercap:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /proc/meminfo:/proc/meminfo:ro
      - ./metrics.csv:/app/metrics.csv
      - ./framework_status.json:/app/framework_status.json
      - ./priority_map.json:/app/priority_map.json
      - ./targets.json:/app/targets.json          # Managed container whitelist (UI-editable)
      - ./discovered_containers.json:/app/discovered_containers.json  # Written by engine, read by dashboard
    environment:
      - HECF_MODE=${HECF_MODE:-full_hecf}
      - GUARDRAIL_CPU_THRESHOLD=${GUARDRAIL_CPU_THRESHOLD:-80}
      - GUARDRAIL_RAM_THRESHOLD=${GUARDRAIL_RAM_THRESHOLD:-90}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - hecf-network

  hecf-dashboard:
    build: .
    container_name: hecf-dashboard
    # Gunicorn: 1 worker × 2 threads — lightweight dashboard needs minimal concurrency
    command: ["gunicorn", "--bind", "0.0.0.0:8092", "--workers", "1", "--threads", "2", "--timeout", "60", "dashboard:app"]
    ports:
      - "8092:8092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only: list containers for modal suggestions
      - ./metrics.csv:/app/metrics.csv:ro
      - ./framework_status.json:/app/framework_status.json
      - ./priority_map.json:/app/priority_map.json
      - ./targets.json:/app/targets.json             # Read + write from dashboard UI
      - ./discovered_containers.json:/app/discovered_containers.json:ro  # Read-only: written by engine
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /proc/meminfo:/proc/meminfo:ro
      - /proc/stat:/proc/stat:ro
      - /proc/loadavg:/proc/loadavg:ro
      - /proc/uptime:/proc/uptime:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hecf-network

  bench-json:
    build: ./http-arena
    container_name: bench-json
    ports:
      - "8000:8000"
    labels:
      - "hecf.priority=low"
    restart: unless-stopped
    networks:
      - hecf-network

  locust-master:
    image: locustio/locust:2.24.0
    container_name: locust-master
    volumes:
      - ./locustfiles:/mnt/locust
    environment:
      - WORKLOAD_TYPE=${WORKLOAD_TYPE:-json}
    command: >
      -f /mnt/locust/locustfile.py
      --host http://bench-json:8000
      --headless
      -u ${LOCUST_USERS:-200}
      -r ${LOCUST_SPAWN_RATE:-20}
      -t ${LOCUST_RUN_TIME:-5m}
      --csv=/mnt/locust/results
    depends_on:
      - bench-json
    networks:
      - hecf-network

networks:
  hecf-network:
    driver: bridge
