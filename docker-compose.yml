version: "3.8"
services:
  hecf:
    build: .
    container_name: hecf
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /proc/meminfo:/proc/meminfo:ro
      - ./metrics.csv:/app/metrics.csv
      - ./framework_status.json:/app/framework_status.json
      - ./priority_map.json:/app/priority_map.json
      - ./targets.json:/app/targets.json          # Managed container whitelist (UI-editable)
      - ./discovered_containers.json:/app/discovered_containers.json  # Written by engine, read by dashboard
    environment:
      - HECF_MODE=full_hecf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - hecf-network

  hecf-dashboard:
    build: .
    container_name: hecf-dashboard
    # Gunicorn: 1 worker × 2 threads — lightweight dashboard needs minimal concurrency
    command: ["gunicorn", "--bind", "0.0.0.0:8092", "--workers", "1", "--threads", "2", "--timeout", "60", "dashboard:app"]
    ports:
      - "8092:8092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only: list containers for modal suggestions
      - ./metrics.csv:/app/metrics.csv:ro
      - ./framework_status.json:/app/framework_status.json
      - ./priority_map.json:/app/priority_map.json
      - ./targets.json:/app/targets.json             # Read + write from dashboard UI
      - ./discovered_containers.json:/app/discovered_containers.json:ro  # Read-only: written by engine
      - /proc/cpuinfo:/proc/cpuinfo:ro
      - /proc/meminfo:/proc/meminfo:ro
      - /proc/stat:/proc/stat:ro
      - /proc/loadavg:/proc/loadavg:ro
      - /proc/uptime:/proc/uptime:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - hecf-network

  bench-json:
    build: ./http-arena
    container_name: bench-json
    ports:
      - "8000:8000"
    labels:
      - "hecf.priority=low"
    restart: unless-stopped
    networks:
      - hecf-network

networks:
  hecf-network:
    driver: bridge
